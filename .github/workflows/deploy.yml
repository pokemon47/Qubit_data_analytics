name: Deploy to Digital Ocean

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: ["Qubit Data Analytics"]
    types:
      - completed
    branches: [ "main" ]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.DROPLET_SSH_KEY }}
        known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
        
    - name: Deploy to Digital Ocean
      env:
        DEPLOY_HOST: 170.64.163.80
        DEPLOY_USER: root
      run: |
        # Copy files to server
        rsync -avz --exclude '.git*' --exclude 'venv' --exclude '__pycache__' --exclude '.coverage' ./ $DEPLOY_USER@$DEPLOY_HOST:/var/www/flask_app/
        
        # SSH into server and restart services
        ssh $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          # Navigate to app directory
          cd /var/www/flask_app
          
          # Update virtual environment
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          
          # Set proper permissions
          sudo chown -R www-data:www-data /var/www/flask_app
          
          # Restart services
          sudo systemctl restart flask_app
          sudo systemctl restart nginx
EOF 